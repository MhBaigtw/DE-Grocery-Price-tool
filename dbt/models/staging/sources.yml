version: 2

sources:
  - name: hammer
    description: >
      The loaded Project Hammer snapshot. Populated by scripts/load_snapshot.py from an
      immutable archive under data/snapshots/, verified by sha256. Never written to by
      this project.
    schema: main
    tables:
      - name: raw
        description: Price observations, one row per product per scrape day.
        columns:
          - name: product_id
            description: >
              Upstream row id. Announced to change from string to number. It appears in the
              staging layer and NOWHERE BELOW IT -- scripts/check_layering.py enforces that,
              so the type change stays an ingest-layer event.
          - name: nowtime
            description: >
              The observation date. An INTEGER written as digits, YYYYMMDD, since upstream's
              unannounced change first seen on 2026-11-06; a 'YYYY-MM-DD' string before it.
              Not an epoch and no time of day. config/expected_schema.json asserts the type.
      - name: product
        description: Product metadata. Updated only when a new product is discovered.
      - name: _snapshot_provenance
        description: >
          Key/value provenance written by scripts/load_snapshot.py: the snapshot id, the
          archive hash, and on a filtered (light) load a `load_filter` row. The date tests
          on stg_price read the snapshot date and the load kind from it.

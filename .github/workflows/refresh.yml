# The automated refresh of the tool's extract, triggered by upstream PUBLISHING, not by a clock.
#
# TWO JOBS. `probe` is cheap and runs daily. It reads hammer-lastupdated.txt (a few hundred
# bytes) and compares it with the newest record in data/provenance/. `refresh` runs only when
# that stamp has changed. Pulling the 975 MB archive every day regardless would buy about one
# percentage point of staleness over a correctly timed refresh, and cost the maintainer's
# volunteer server seven times the bandwidth (docs/phase-4-findings.md §1.4, §10).
#
# WHY A HOSTED RUNNER IS ENOUGH. scripts/refresh_light.py loads only the two chains the tool reads
# (their full history) and runs every gate that guards the extract's correctness. Measured on
# snapshot 20260911T200435Z: peak disk ~5 GiB, peak memory 2.7 GiB (§10). A standard hosted Linux
# runner for a public repository has 14 GB SSD and 16 GB RAM, and is free.
#
# WHAT SHIPS. On success the job commits tool/data/ and a provenance record to main, and Netlify
# builds that push through its own gates (scripts/netlify_build.sh). On any refusal nothing is
# committed, the site keeps serving the previous extract (whose age the page states), and an
# issue is opened. A silent refresh failure is the failure this workflow exists to prevent.
name: refresh

on:
  schedule:
    # 05:00 UTC daily -- after the observed upstream publication window (20:20-21:48 ET).
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Refresh even if upstream's last-updated stamp matches the newest record
        type: boolean
        default: false
      publish:
        description: Publish what main already holds, without waiting for a new publication
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    # A refused probe is retried at 0, +15 and +45 minutes (refresh_light.py), so the job must
    # outlive the retry window. It is never allowed longer than that.
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    outputs:
      changed: ${{ steps.probe.outputs.changed }}
      published_ok: ${{ steps.published.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Has upstream published since the newest provenance record?
        id: probe
        run: python scripts/refresh_light.py --probe-only

      # Separate from "a refresh is due": this is the alarm for a pipeline that has stopped.
      - name: Alert -- upstream refused the probe on every attempt
        if: failure() && steps.probe.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Automated refresh refused or failed';
            const body = [
              '**The probe could not read upstream\'s last-updated stamp after three attempts over 45 minutes.**',
              'The answer was not a date stamp (for example, a bot-verification challenge page), so nothing was decided or recorded.',
              'The client is not disguised and the challenge is not attempted; if this repeats, use the fallback on the owner\'s PC or contact the maintainer.',
              '', `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const open = (await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open'})).data
              .find(i => i.title === title);
            if (open) await github.rest.issues.createComment({owner: context.repo.owner,
              repo: context.repo.repo, issue_number: open.number, body});
            else await github.rest.issues.create({owner: context.repo.owner,
              repo: context.repo.repo, title, body});

      - name: Is the live extract still inside its age limit?
        id: age
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python scripts/check_extract.py

      - name: Alert -- the live extract is past its age limit
        if: steps.age.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'The live extract is past its age limit';
            const body = [
              '**The extract the site is serving is older than `check_extract.py` allows.**',
              'The automated refresh has stopped, is failing, or upstream has not published.',
              'The page states the data\'s age and warns once it passes the measured horizon,',
              'so visitors are told; this issue is for the people who can fix it.',
              '', `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const open = (await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open'})).data
              .find(i => i.title === title);
            if (open) await github.rest.issues.createComment({owner: context.repo.owner,
              repo: context.repo.repo, issue_number: open.number, body});
            else await github.rest.issues.create({owner: context.repo.owner,
              repo: context.repo.repo, title, body});

      # The gap that hid a two-week outage: every other check runs against the working tree or
      # the freshly built extract, so a publish step that stops is invisible. This asks the live
      # site what it is serving and compares it with what main holds. It reports rather than
      # alerts: a site found behind here triggers the publish job below, and only a site still
      # behind AFTER that publish is worth waking someone for.
      - name: Is the live site serving what main holds?
        id: published
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python scripts/check_published.py --wait-minutes 0

      - name: Fail the run when the live extract is past its limit
        if: steps.age.outcome == 'failure'
        run: |
          echo "The live extract no longer passes its own age limit. Deliberately loud."
          exit 1


  refresh:
    needs: probe
    # !cancelled(): a stale-extract alarm in `probe` must not stop the refresh that fixes it.
    if: ${{ !cancelled() && (needs.probe.outputs.changed == 'true' || inputs.force == true) }}
    runs-on: ubuntu-latest
    # Up to 45 minutes of retries for the stamp and again for the archive, plus the build.
    timeout-minutes: 180
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}

      # duckdb pinned to the version the committed extract and its parity check were built with.
      - name: Install
        run: python -m pip install --quiet duckdb==1.5.5 pandas psutil

      - name: Light refresh -- fetch, filtered load, every correctness gate
        run: python scripts/refresh_light.py --measure ${{ inputs.force == true && '--force' || '' }}

      - name: Commit the extract and its provenance
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tool/data data/provenance
          if git diff --cached --quiet; then
            echo "Nothing changed. Nothing to commit."
            exit 0
          fi
          rec=$(ls data/provenance/*.json | sort | tail -1)
          msg=$(python -c "import json,sys; r=json.load(open(sys.argv[1])); print('Refresh: snapshot', r['snapshot_id'], '- upstream', r['upstream_lastupdated_raw'], '- extract', r['extract']['extract_date'])" "$rec")
          git commit -q -m "$msg"
          git pull --rebase --quiet origin main
          git push origin HEAD:main

      # The first run's challenge could not be tied to an address because none was logged
      # (findings §11). One request to an IP echo service, only on failure.
      - name: Record this runner's egress address
        if: failure()
        run: echo "egress address -- $(curl -sS --max-time 10 https://api.ipify.org || echo unknown)"

      - name: Alert -- the refresh refused or failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Automated refresh refused or failed';
            const body = [
              '**A light refresh did not complete. Nothing was committed; the site keeps serving the previous extract.**',
              'A refusal by a gate is the designed behaviour, not an outage. Read the run log for which gate and why.',
              '', `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const open = (await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open'})).data
              .find(i => i.title === title);
            if (open) await github.rest.issues.createComment({owner: context.repo.owner,
              repo: context.repo.repo, issue_number: open.number, body});
            else await github.rest.issues.create({owner: context.repo.owner,
              repo: context.repo.repo, title, body});

  # Publishing is its own job so it can run in three situations: after a refresh commits, when
  # the daily probe finds the live site behind what main holds (the September outage would have
  # healed itself), and on demand. It re-runs the gates and uploads finished files; no builder
  # of the host's is involved, because one that could refuse is what froze the site before.
  publish:
    needs: [probe, refresh]
    if: ${{ !cancelled() && (needs.refresh.result == 'success' || inputs.publish == true || needs.probe.outputs.published_ok == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}

      - name: Gate and assemble the site
        run: bash scripts/netlify_build.sh

      - name: Publish to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bash scripts/vercel_publish.sh

      - name: Is the live site serving what main holds?
        id: published
        continue-on-error: true
        run: python scripts/check_published.py --wait-minutes 10

      # Compression is the host's property, not ours, and it is the difference between a page
      # usable in 3.3 s and one that takes 40 (findings §8). It is checked on the live response
      # after every publish, never assumed from configuration.
      - name: Verify the live site, compression included
        id: verified
        continue-on-error: true
        run: python scripts/verify_deploy.py "$(python -c "import sys; sys.path.insert(0,'scripts'); import check_published; print(check_published.URL)")"

      # failure() covers the step that did not run: if the upload itself fails, `published`
      # never reports, and an alert conditioned only on its outcome would say nothing at all.
      # Demonstrated on 2026-09-30 by a rehearsal that failed the upload deliberately.
      - name: Alert -- the site is behind and publishing did not fix it
        if: ${{ failure() || steps.published.outcome == 'failure' || steps.verified.outcome == 'failure' }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'The live site is not serving the committed extract';
            const body = [
              '**The live site is behind what main holds, and the publish that should have fixed it did not.**',
              'Either the upload failed, or it succeeded and the site still serves an older extract, or the deployed site failed verification (assets, dates, disclosures or compression).',
              'Read the run log for which of those it was. Visitors are not misled -- the page states how old its prices are -- but the tool is stale.',
              '', `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const open = (await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open'})).data
              .find(i => i.title === title);
            if (open) await github.rest.issues.createComment({owner: context.repo.owner,
              repo: context.repo.repo, issue_number: open.number, body});
            else await github.rest.issues.create({owner: context.repo.owner,
              repo: context.repo.repo, title, body});

      - name: Fail the run when the site does not serve what was published
        if: ${{ steps.published.outcome == 'failure' || steps.verified.outcome == 'failure' }}
        run: |
          echo "published: ${{ steps.published.outcome }} | verified: ${{ steps.verified.outcome }}"
          exit 1

# Deploy the static tool to GitHub Pages — but only after the extract passes its gates.
#
# WHY CI ONLY DOES THIS HALF. The full refresh needs ~1.45 GB of archives, an extracted
# SQLite and a 3.2 GB DuckDB. That does not fit the ~14 GB a GitHub-hosted runner offers, so
# the rebuild runs where the data already lives (scripts/refresh.py, locally or on a
# self-hosted runner) and commits a ~5 MB extract. CI validates that extract and ships it.
# See docs/phase-4-findings.md §4.
#
# BRIEF 5.3: "A refresh that fails any check leaves the previous deploy in place." That is
# what the gate job below buys — deploy depends on it, so a failed gate means no deploy at
# all rather than a deploy of something unverified.
name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'tool/**'
      - 'dashboard/**'
      - 'scripts/check_extract.py'
      - 'scripts/test_tool_render.js'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Do not cancel one in flight: a half-finished deploy is worse
# than a slightly late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}

      # The extract must be honest before it is fast. Structure and floors, not remembered
      # values, so a legitimate weekly change in every count does not trip it.
      - name: Extract gate
        run: python scripts/check_extract.py

      # And the page must not betray at render time what the extract enforces.
      - name: Render gate
        run: node scripts/test_tool_render.js

      - name: Gate self-tests
        run: python scripts/test_check_extract.py

      - name: Manifest
        run: python scripts/check_manifest.py

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r tool/* _site/
          mkdir -p _site/dashboard
          cp -r dashboard/* _site/dashboard/
          # A custom domain, if one has been set (brief 5.2). Absent is fine; the site
          # then serves from github.io and nothing pretends otherwise.
          if [ -f tool/CNAME ]; then cp tool/CNAME _site/CNAME; fi
          # Fail loudly rather than deploying a site with no data in it.
          test -s _site/index.html
          test -s _site/data/products.json
          test -s _site/data/meta.json
          test -s _site/data/history.json
          echo "site assembled:"; du -sh _site; find _site -maxdepth 2 -type f | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # BRIEF 5.5: verify the deployed site the way the dashboard was verified — over HTTP,
  # against the live URL, not against the working tree. A deploy that "succeeded" while
  # serving a stale or broken extract is exactly the silent failure this phase is about.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify the live site
        run: python scripts/verify_deploy.py "${{ needs.deploy.outputs.page_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}"

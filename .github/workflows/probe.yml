# The daily probe, and the alert (brief 4.5).
#
# §1.4 derived a WEEKLY refresh consuming Thursday's scrape, with a daily cheap check that
# the file actually arrived. This is that check. It fetches hammer-lastupdated.txt — a few
# hundred bytes — and never the 1.45 GB archive, because the archive lives on a volunteer's
# server and a daily full pull buys about one percentage point of accuracy for seven times
# the bandwidth.
#
# WHY AN ISSUE RATHER THAN A LOG LINE. Brief 4.5: "Alert on failure in a way you will
# actually notice. A silent refresh failure means the site serves stale prices with a
# fresh-looking date." A workflow that quietly goes red is not noticed. An issue is, and it
# is reopened and updated rather than duplicated, so the alert has one home.
name: probe

on:
  schedule:
    # 05:00 UTC daily — after the observed upstream publication window (20:20–21:48 ET,
    # n=3), with roughly three hours of margin in EDT and two in EST.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      # Ask upstream what it has published, and compare against the extract we are serving.
      # --probe-only never downloads an archive and never touches the database.
      - name: Probe upstream
        id: probe
        run: |
          set -o pipefail
          python scripts/refresh.py --probe-only 2>&1 | tee probe.txt
          echo "decision<<EOF" >> "$GITHUB_OUTPUT"
          grep -E 'decision|probe' probe.txt >> "$GITHUB_OUTPUT" || true
          echo "EOF" >> "$GITHUB_OUTPUT"
          if grep -q 'REFRESH --' probe.txt; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi

      # A hard failure: the extract being served is too old to be defensible. This is a
      # separate condition from "a refresh is due" — one is a schedule, the other is the
      # silent-failure alarm.
      - name: Is the served extract still defensible?
        id: age
        continue-on-error: true
        run: python scripts/check_extract.py

      - name: Open or update the alert
        if: steps.probe.outputs.due == 'true' || steps.age.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '**The refresh is due, or the extract being served is past its limit.**',
              '',
              '```',
              `${{ steps.probe.outputs.decision }}`,
              '```',
              '',
              `Extract gate: \`${{ steps.age.outcome }}\``,
              '',
              'The full rebuild does not run here — it needs ~1.45 GB of archives and a',
              '3.2 GB DuckDB, which does not fit a hosted runner. Run it where the data is:',
              '',
              '```',
              'python scripts/refresh.py',
              '```',
              '',
              'It gates on schema, determinism, reproducibility, the dbt contracts and the',
              'extract floors. If every gate passes, commit `tool/data/` and the deploy',
              'workflow ships it. If any gate fails, nothing deploys and the current site',
              'stays live — which is the designed behaviour, not an outage.',
              '',
              `_Probed ${new Date().toISOString().slice(0,10)} by the daily probe._`
            ].join('\n');
            const title = 'Refresh due: upstream has published newer data';
            const existing = (await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'refresh'
            })).data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['refresh']
              });
            }

      - name: Fail the run if the served extract is past its limit
        if: steps.age.outcome == 'failure'
        run: |
          echo "The live extract no longer passes its own gate. This is the silent-failure"
          echo "alarm from brief 4.5, and it is deliberately loud."
          exit 1

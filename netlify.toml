# Netlify deployment for the price-lookup tool.
#
# THE BUILD IS A GATE, NOT A COPY. `scripts/netlify_build.sh` runs `check_extract.py` before
# it assembles anything, and a refused extract exits non-zero. On Netlify that means the
# deploy fails and the previous one stays live, which is the behaviour brief 4.3 and 5.3 ask
# for: a refresh that fails any check does not ship.
#
# Compression is Netlify's job and is verified rather than assumed. `verify_deploy.py` asks
# the live host for the large JSON with `Accept-Encoding` and fails if it comes back
# uncompressed -- the difference between a tool that is usable on a phone in 3.3 s and one
# that takes 40 s (findings §8). That check runs against the deployed URL, after this.

[build]
  command = "bash scripts/netlify_build.sh"
  publish = "_site"
  # Skip the build when nothing that ships changed (a documentation-only commit). Exit 0 skips.
  # Fails safe: if the change cannot be established, it builds. See scripts/netlify_changes.sh.
  ignore  = "bash scripts/netlify_changes.sh ignore"

[build.environment]
  PYTHON_VERSION = "3.12"
  NODE_VERSION   = "20"

# Only main publishes. These contexts exist so that a branch build or a deploy preview is
# refused by the build script rather than quietly becoming a public URL that looks like the
# real tool. The same thing should also be switched off in the Netlify UI; this is the
# backstop, not the setting.
[context.production]
  command = "bash scripts/netlify_build.sh"

[context.deploy-preview]
  command = "echo 'Deploy previews are disabled for this site: only main publishes.' && exit 1"

[context.branch-deploy]
  command = "echo 'Branch deploys are disabled for this site: only main publishes.' && exit 1"

# The data files are regenerated by a weekly refresh and are the whole point of the site, so
# they must never be served from a stale cache after a deploy. Netlify invalidates its CDN on
# every deploy; this makes the browser's own cache short-lived too, because a visitor holding
# yesterday's products.json would see prices the page's own date field contradicts.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# No third-party anything, enforced at the edge as well as in the page. The brief's non-goal
# on ads and trackers is deferred pending a written answer from the maintainer, and a CSP is
# the difference between "we did not add any" and "none can be added by accident".
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
